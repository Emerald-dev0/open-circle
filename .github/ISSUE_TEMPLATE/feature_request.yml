name: Feature request
description: Suggest an improvement to OpenCircle.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe who needs this and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Share another approach or a useful reference, if you have one.
