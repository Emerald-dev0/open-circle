<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04060A" />
    <meta name="color-scheme" content="dark" />

    <title>OpenCircle · Live GitHub ranking for Open Source Circle</title>
    <meta
      name="description"
      content="The live GitHub leaderboard for the Open Source Circle developer community. Paste your username, take your place, and climb as the circle stars your work."
    />
    <meta name="author" content="Open Source Circle" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/AspektaVF.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <!-- Open Graph: WhatsApp, LinkedIn, Facebook, Slack, Discord, iMessage -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenCircle" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:title" content="Paste your username. Take your place." />
    <meta
      property="og:description"
      content="The live GitHub ranking for Open Source Circle. Stars, followers and repos, ranked in real time."
    />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OpenCircle: a white podium with a gold crown over first place, inside an open chrome ring." />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@_Cybersmith" />
    <meta name="twitter:title" content="Paste your username. Take your place." />
    <meta
      name="twitter:description"
      content="The live GitHub ranking for Open Source Circle. Stars, followers and repos, ranked in real time."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />
    <meta name="twitter:image:alt" content="OpenCircle: a white podium with a gold crown over first place, inside an open chrome ring." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "OpenCircle",
        "alternateName": "Open Source Circle",
        "url": "%SITE_URL%/",
        "description": "The live GitHub leaderboard for the Open Source Circle developer community.",
        "inLanguage": "en"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
